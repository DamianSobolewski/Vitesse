      - generic [ref=f43e85]:
        - generic [ref=f43e86]:
          - paragraph [ref=f43e87]: Układy oczyszczania spalin
          - heading "DPF / FAP, EGR, SCR i AdBlue" [level=2] [ref=f43e88]
          - paragraph [ref=f43e89]: Filtr cząstek stałych, zawór recyrkulacji spalin i układ AdBlue projektowano pod auto, które regularnie wyjeżdża w trasę i nagrzewa wydech. Przy krótkich odcinkach, w ruchu miejskim i we flocie kurierskiej regeneracja filtra nie dochodzi do końca, EGR zarasta nagarem, a błąd SCR potrafi odliczać kilometry do blokady rozruchu.
          - paragraph [ref=f43e90]: "Zaczynamy od diagnostyki: odczytu błędów, stopnia zapełnienia filtra i historii regeneracji. Potem ustawiamy progi i przebieg regeneracji pod Twój sposób jazdy, korygujemy pracę EGR i dawkowanie AdBlue. Jeśli filtr jest mechanicznie zużyty, usłyszysz to od nas przed wyceną."
          - heading "Kiedy warto" [level=3] [ref=f43e91]
          - list [ref=f43e92]:
            - listitem [ref=f43e93]: Auto z silnikiem diesla eksploatowane jest głównie na krótkich dystansach
            - listitem [ref=f43e94]: Awarie układów oczyszczania spalin nasilają się, a koszty napraw rosną
            - listitem [ref=f43e95]: Gdy serwis, mimo wymiany wielu części, nie potrafi zlokalizować usterki
        - figure [ref=f43e97]:
          - img "Przekrój filtra spalin i układu SCR na tle metalowej siatki" [ref=f43e98]
      - generic [ref=f43e100]:
        - generic [ref=f43e101]:
          - paragraph [ref=f43e102]: Komfort i trwałość
          - heading "Wyłączanie systemu Start&Stop" [level=2] [ref=f43e103]
          - paragraph [ref=f43e104]: System start-stop gasi silnik na każdych światłach i uruchamia go, gdy puszczasz hamulec. W mieście to kilkadziesiąt rozruchów dziennie, a każdy obciąża rozrusznik, akumulator i koło dwumasowe. Przycisk na konsoli wyłącza system tylko do następnego uruchomienia auta, więc naciskasz go przy każdym starcie.
          - paragraph [ref=f43e105]: "Wyłączamy start-stop programowo, w sterowniku silnika. Auto zapamiętuje ten stan na stałe: nie dotykasz niczego po odpaleniu, a pozostałe funkcje działają jak dotąd. Możemy także odwrócić działanie przycisku."
          - heading "Kiedy warto" [level=3] [ref=f43e106]
          - list [ref=f43e107]:
            - listitem [ref=f43e108]: Jeździsz głównie po mieście i silnik gaśnie kilkadziesiąt razy dziennie.
            - listitem [ref=f43e109]: Wymieniałeś akumulator albo rozrusznik wcześniej, niż zakłada serwis.
            - listitem [ref=f43e110]: Masz dość wyłączania systemu przyciskiem po każdym uruchomieniu.
            - listitem [ref=f43e111]: Lubisz jeździć dynamicznie a system wyłącza silnik zaraz po ostrym przyspieszaniu
        - figure [ref=f43e113]:
          - img "Palec naciskający przycisk Start&Stop wśród przycisków na konsoli środkowej" [ref=f43e114]
      - generic [ref=f43e116]:
        - generic [ref=f43e117]:
          - paragraph [ref=f43e118]: Ochrona silnika
          - heading "Podnoszenie ciśnienia oleju" [level=2] [ref=f43e119]
          - paragraph [ref=f43e120]: W wielu nowoczesnych silnikach pompa oleju ma regulowaną wydajność, a sterownik ustawia ją możliwie nisko, żeby oszczędzać paliwo. Na papierze to wystarcza. W praktyce, przy gorącym silniku, zużytym oleju i dużym obciążeniu, ciśnienie spada do granicy, za którą zaczyna się przyspieszone zużycie panewek wałka i łańcucha rozrządu.
          - paragraph [ref=f43e121]: Korygujemy mapę sterowania pompą tak, by ciśnienie w całym zakresie obrotów trzymało bezpieczny zapas. Koszt tej modyfikacji jest symboliczny w porównaniu do kosztu związanego z remontem lub wymianą silnika.
          - heading "Kiedy warto" [level=3] [ref=f43e122]
          - list [ref=f43e123]:
            - listitem [ref=f43e124]: Silnik z rodziny znanej z problemów z łańcuchem rozrządu albo panewkami.
            - listitem [ref=f43e125]: "Auto pracuje pod obciążeniem: przyczepa, kamper, dostawczak z ładunkiem."
            - listitem [ref=f43e126]: Po chip tuningu, gdy wyższy moment wymaga lepszego smarowania.
            - listitem [ref=f43e127]: Jeśli lubisz autem poszaleć lub używasz go czasem na torze.
        - figure [ref=f43e129]:
          - img "Wskaźnik ciśnienia oleju z podziałką od 0 do 8 i czerwoną kontrolką obok" [ref=f43e130]
      - generic [ref=f43e132]:
        - generic [ref=f43e133]:
          - paragraph [ref=f43e134]: Ochrona silnika
          - heading "Obniżanie temperatury pracy silnika" [level=2] [ref=f43e135]
          - paragraph [ref=f43e136]: "Producenci podnoszą temperaturę pracy silnika, bo gorętszy silnik to niższe spalanie w teście homologacyjnym. Dla silnika pracującego pod obciążeniem to kłopot: mniejszy zapas do przegrzania, gęstszy nagar, szybciej starzejący się olej i uszczelki."
          - paragraph [ref=f43e137]: Zmieniamy progi termostatu sterowanego elektronicznie i charakterystykę pracy wentylatorów, żeby silnik utrzymywał niższą, stabilną temperaturę. Przedłuży to żywotność wielu elementów, zapewni też większe rezerwy bezpieczeństwa.
          - heading "Kiedy warto" [level=3] [ref=f43e138]
          - list [ref=f43e139]:
            - listitem [ref=f43e140]: Jeździsz z przyczepą, kamperem albo z pełnym ładunkiem w upały.
            - listitem [ref=f43e141]: Wskaźnik temperatury wchodzi wysoko na podjazdach i w korkach.
            - listitem [ref=f43e142]: Silnik po modyfikacjach mocy, które podnoszą ilość ciepła do odebrania.
        - figure [ref=f43e144]:
          - img "Wskaźnik temperatury silnika i kontrolka check engine na desce rozdzielczej" [ref=f43e145]
      - generic [ref=f43e147]:
        - generic [ref=f43e148]:
          - paragraph [ref=f43e149]: Kolektor dolotowy
          - heading "Klapy wirowe" [level=2] [ref=f43e150]
          - paragraph [ref=f43e151]: "Klapy w kolektorze dolotowym mają zawirowywać powietrze przy niskich obrotach. W kilku popularnych rodzinach silników to typowy punkt awaryjny: zacierają się od nagaru, pękają osie i dźwignie, a urwany element potrafi trafić do cylindra. Sterownik widzi niezgodność położenia i zapala kontrolkę, czasem z trybem awaryjnym."
          - paragraph [ref=f43e152]: Jeśli naprawa mechaniczna nie ma sensu, można klapy zablokować lub zdemontować (ewentualnie wymienić kolektor na wersję bez klap) oraz wyłączyć je programowo. Bez błędów i bez ryzyka, że luźna część wpadnie do dolotu.
          - heading "Kiedy warto" [level=3] [ref=f43e153]
          - list [ref=f43e154]:
            - listitem [ref=f43e155]: Błąd położenia klap wraca po skasowaniu albo po wymianie siłownika.
            - listitem [ref=f43e156]: Kolektor był już naprawiany, a usterka pojawia się ponownie.
            - listitem [ref=f43e157]: Chcesz uniknąć kosztownej wymiany całego kolektora.
        - figure [ref=f43e159]:
          - img "Mechanik w rękawicach trzyma przepustnicę z klapą w komorze silnika" [ref=f43e160]
      - generic [ref=f43e162]:
        - generic [ref=f43e163]:
          - paragraph [ref=f43e164]: Floty i tor
          - heading "Limitery prędkości i obrotów" [level=2] [ref=f43e165]
          - paragraph [ref=f43e166]: Jeśli limiter prędkości przeszkadza Ci na autostradzie – możemy go przesunąć lub zdjąć.
          - paragraph [ref=f43e167]: Ale limitery to także świetne narzędzie w kontroli kosztów we flotach pojazdów. Ich założenie pozwala obniżyć zarówno zużycie paliwa jak i całego układu napędowego, co przekłada się na niższe koszty utrzymania floty.
          - paragraph [ref=f43e168]: "Zakładamy, przesuwamy albo zdejmujemy ograniczenia prędkości i obrotów w sterowniku. Wartość ustalasz Ty: jedną dla całej floty albo inną dla każdego pojazdu. Zmianę dokumentujemy, więc przy kontroli ubezpieczyciela masz czarno na białym, co i kiedy ustawiono."
        - generic [ref=f43e169]:
          - heading "Co robimy" [level=3] [ref=f43e170]
          - list [ref=f43e171]:
            - listitem [ref=f43e172]:
              - generic [ref=f43e178]:
                - heading "Limit prędkości pod politykę floty" [level=4] [ref=f43e179]
                - text: Jedna wartość dla wszystkich aut, na przykład 120 km/h, albo osobna dla dostawczych i osobowych.
            - listitem [ref=f43e180]:
              - generic [ref=f43e184]:
                - heading "Limit obrotów dla trwałości silnika" [level=4] [ref=f43e185]
                - text: Ustawienie limitera np. na 3000 obr/min pozwala sprawnie się poruszać, ograniczając jednocześnie spalanie i przedwczesne zużycie silnika.
            - listitem [ref=f43e186]:
              - generic [ref=f43e191]:
                - heading "Obsługa partiami, faktury" [level=4] [ref=f43e192]
                - generic [ref=f43e193]:
                  - text: Flotę programujemy w umówionych turach, żeby auta nie stały w jednym tygodniu.
                  - link "Zobacz ofertę dla flot" [ref=f43e194] [cursor=pointer]:
                    - /url: /podnoszenie-mocy/oferta-dla-flot/
                  - text: .
      - generic [ref=f43e196]:
        - generic [ref=f43e197]:
          - paragraph [ref=f43e198]: Układ wydechowy
          - heading "Druga sonda lambda" [level=2] [ref=f43e199]
          - paragraph [ref=f43e200]: Druga sonda, za katalizatorem, nie steruje składem mieszanki. Sprawdza tylko, czy katalizator pracuje. Po jego wymianie na inny niż fabryczny albo przy zużytym wkładzie sterownik widzi odchyłkę i zapala check engine, czasem także z trybem awaryjnym.
          - paragraph [ref=f43e201]: Programowo wyłączamy diagnostykę drugiej sondy w sterowniku. Silnik dalej pracuje na pierwszej sondzie, więc skład mieszanki i spalanie zostają bez zmian. Znikają kontrolka i błędy P0420 oraz P0430. Jeśli katalizator jest sprawny, a błąd bierze się z nieszczelności wydechu, najpierw powiemy Ci o tym.
          - heading "Kiedy warto" [level=3] [ref=f43e202]
          - list [ref=f43e203]:
            - listitem [ref=f43e204]: Po wymianie katalizatora na zamiennik, który sterownik uznaje za niesprawny.
            - listitem [ref=f43e205]: Błąd P0420 lub P0430 wraca po każdym skasowaniu.
            - listitem [ref=f43e206]: Jazda z kontrolką „check engine” to ryzyko przeoczenia innych usterek
        - figure [ref=f43e208]:
          - img "Żółta kontrolka check engine na zegarze samochodu" [ref=f43e209]
      - generic [ref=f43e211]:
        - generic [ref=f43e212]:
          - paragraph [ref=f43e213]: Zimny rozruch
          - heading "Korekta dawki rozruchowej" [level=2] [ref=f43e214]
          - paragraph [ref=f43e215]: Jeśli na zimnym silniku nie ma problemów z rozruchem, ale pojawiają się na rozgrzanym, wtedy najczęściej przyczyną są częściowo zużyte (pompo)wtryskiwacze. Gorące paliwo jest rzadsze i ucieka do powrotów przez drobne nieszczelności, przez co fabryczna dawka paliwa okazuje się zbyt mała do skutecznego rozruchu. Programowa korekta dawki rozruchowej pozwala na uniknięcie większych kosztów związanych z regeneracją lub wymianą wtryskiwaczy.
        - figure [ref=f43e217]:
          - img "Dłoń przekręcająca kluczyk w stacyjce, w tle zegar prędkościomierza" [ref=f43e218]
      - generic [ref=f43e220]:
        - generic [ref=f43e221]:
          - paragraph [ref=f43e222]: Subaru
          - heading "Pompa powietrza dodatkowego SAI" [level=2] [ref=f43e223]
          - paragraph [ref=f43e224]: Układ SAI wdmuchuje powietrze do wydechu przez pierwsze dwie minuty po zimnym rozruchu, żeby szybciej nagrzać katalizator. W Subaru pompa i zawory zapiekają się od wilgoci, a sterownik zgłasza błędy z zakresu P0410 do P2444 i zapala check engine. Naprawa to komplet części za kilka tysięcy złotych, a usterka lubi wracać.
          - paragraph [ref=f43e225]: "Programowo wyłączamy układ SAI w sterowniku: ECU przestaje oczekiwać pompy i zaworów, kontrolka gaśnie, tryb awaryjny się nie włącza. Praca rozgrzanego silnika nie zmienia się, bo układ i tak działa tylko chwilę po starcie. Pompę i zawory zostawiasz albo demontujesz."
          - heading "Kiedy warto" [level=3] [ref=f43e226]
          - list [ref=f43e227]:
            - listitem [ref=f43e228]: Subaru z błędami P0410, P0411 albo P2440 do P2444.
            - listitem [ref=f43e229]: Pompa SAI była już wymieniana i usterka wróciła.
            - listitem [ref=f43e230]: Check engine zapala się tylko po zimnym rozruchu.
        - figure [ref=f43e232]:
          - img "Kontrolka check engine na czerwonym obrotomierzu" [ref=f43e233]
      - generic [ref=f43e235]:
        - generic [ref=f43e236]:
          - paragraph [ref=f43e237]: Mechanika i oprogramowanie
          - heading "Czyszczenie układów dolotowych" [level=2] [ref=f43e238]
          - paragraph [ref=f43e239]: W silnikach z wtryskiem bezpośrednim paliwo nie obmywa zaworów dolotowych, więc nagar z odmy i EGR osiada na nich warstwa po warstwie. Ten problem może pojawić się już nawet po kilkudziesięciu tysiącach kilometrów. Żaden dodatek do paliwa tego nie usunie.
          - paragraph [ref=f43e240]: "Zaczynamy od kamerki inspekcyjnej, czyścimy kolektor i zawory chemicznie i mechanicznie – łupinkami orzechów pod ciśnieniem. Efekt możemy sprawdzić na hamowni: pomiar przed i po pokazuje, ile mocy wróciło."
          - heading "Kiedy warto" [level=3] [ref=f43e241]
          - list [ref=f43e242]:
            - listitem [ref=f43e243]: Gdy silnik dymi lub szybko wracają problemy z DPFem
            - listitem [ref=f43e244]: Nierówna praca na biegu jałowym, szarpanie i gorsze przyspieszenie.
            - listitem [ref=f43e245]: Przed chip tuningiem, żeby program pracował na czystym dolocie.
