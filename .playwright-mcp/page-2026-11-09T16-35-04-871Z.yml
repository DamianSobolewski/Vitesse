      - generic [ref=f43e276]:
        - generic [ref=f43e277]:
          - paragraph [ref=f43e278]: Sterownik skrzyni
          - heading "Programowanie skrzyń biegów (TCU)" [level=2] [ref=f43e279]
          - paragraph [ref=f43e280]: Skrzynia automatyczna ma własny komputer. To on decyduje, kiedy zmienić bieg, jak szybko to zrobić i ile momentu przepuścić przez sprzęgła. Po chip tuningu większy moment obrotowy silnika może nie zostać zrealizowany, jeśli limitery zapisane w skrzyni biegów na to nie pozwolą.
          - paragraph [ref=f43e281]: "Programujemy TCU pod nowe parametry silnika: szybsza zmiana przełożeń, wyższy limit momentu na sprzęgłach, wcześniejsza blokada konwertera, dopasowane punkty zmiany biegów. Przy większych przyrostach momentu to nie dodatek, tylko warunek, żeby zestaw pracował bezpiecznie."
          - heading "Kiedy warto" [level=3] [ref=f43e282]
          - list [ref=f43e283]:
            - listitem [ref=f43e284]: Po chip tuningu auta z automatem, zwłaszcza DSG, ZF 8HP i skrzyniach dwusprzęgłowych.
            - listitem [ref=f43e285]: Gdy powolny start powoduje dodatkowe emocje przy włączaniu się do ruchu
            - listitem [ref=f43e286]: Gdy skrzynia zmienia biegi przy zbyt niskich obrotach silnika
        - figure [ref=f43e288]:
          - img "Lewarek automatycznej skrzyni biegów w konsoli środkowej" [ref=f43e289]
      - generic [ref=f43e291]:
        - generic [ref=f43e292]:
          - paragraph [ref=f43e293]: ECU unlock
          - heading "Odblokowywanie sterowników" [level=2] [ref=f43e294]
          - paragraph [ref=f43e295]: Wiele sterowników od połowy 2020 roku jest zablokowana przed odczytem i programowaniem. Przez kilka lat oznaczało to brak jakichkolwiek możliwości modyfikacji oprogramowania – niezależnie czy związanej z podnoszeniem mocy, czy też z innymi usługami opartymi o zmiany w sofcie.
          - paragraph [ref=f43e296]: Obecnie jest to już możliwe, choć wiele firm korzysta z możliwości odblokowania poprzez wysyłkę modułu za granicę, co oznacza unieruchomienie auta na kilka dni. U nas zablokowane ECU odblokowujemy na miejscu, więc cała operacja odbywa się podczas jednej wizyty.
