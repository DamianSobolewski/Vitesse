        - generic [ref=f1e363]:
          - paragraph [ref=f1e364]: Sterownik skrzyni
          - heading "Programowanie skrzyń biegów (TCU)" [level=2] [ref=f1e365]
          - paragraph [ref=f1e366]: Skrzynia automatyczna ma własny komputer. To on decyduje, kiedy zmienić bieg, jak szybko to zrobić i ile momentu przepuścić przez sprzęgła. Po chip tuningu większy moment obrotowy silnika może nie zostać zrealizowany, jeśli limitery zapisane w skrzyni biegów na to nie pozwolą.
          - paragraph [ref=f1e367]: "Programujemy TCU pod nowe parametry silnika: szybsza zmiana przełożeń, wyższy limit momentu na sprzęgłach, wcześniejsza blokada konwertera, dopasowane punkty zmiany biegów. Przy większych przyrostach momentu to nie dodatek, tylko warunek, żeby zestaw pracował bezpiecznie."
          - heading "Kiedy warto" [level=3] [ref=f1e368]
          - list [ref=f1e369]:
            - listitem [ref=f1e370]: Po chip tuningu auta z automatem, zwłaszcza DSG, ZF 8HP i skrzyniach dwusprzęgłowych.
            - listitem [ref=f1e371]: Gdy powolny start powoduje dodatkowe emocje przy włączaniu się do ruchu
            - listitem [ref=f1e372]: Gdy skrzynia zmienia biegi przy zbyt niskich obrotach silnika
        - figure [ref=f1e374]:
          - img "Lewarek automatycznej skrzyni biegów w konsoli środkowej" [ref=f1e375]
      - generic [ref=f1e377]:
        - generic [ref=f1e378]:
          - paragraph [ref=f1e379]: ECU unlock
          - heading "Odblokowywanie sterowników" [level=2] [ref=f1e380]
          - paragraph [ref=f1e381]: Wiele sterowników od połowy 2020 roku jest zablokowana przed odczytem i programowaniem. Przez kilka lat oznaczało to brak jakichkolwiek możliwości modyfikacji oprogramowania – niezależnie czy związanej z podnoszeniem mocy, czy też z innymi usługami opartymi o zmiany w sofcie.
          - paragraph [ref=f1e382]: Obecnie jest to już możliwe, choć wiele firm korzysta z możliwości odblokowania poprzez wysyłkę modułu za granicę, co oznacza unieruchomienie auta na kilka dni. U nas zablokowane ECU odblokowujemy na miejscu, więc cała operacja odbywa się podczas jednej wizyty.
