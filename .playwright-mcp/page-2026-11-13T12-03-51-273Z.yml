          - paragraph [ref=f1e45]: "Kilkanaście różnych usług, które możemy wykonać dzięki modyfikacji oprogramowania - od podniesienia mocy, przez DPF, EGR, SCR, układ Start&Stop i ciśnienie oleju, po sondę Lambda i skrzynię biegów. Zobacz poniżej czy znajdziesz to czego szukasz:"
      - generic [ref=f1e46]:
        - generic [ref=f1e47]:
          - generic [ref=f1e48]:
            - paragraph [ref=f1e49]: Serwis ECU
            - heading "Sterownik odpowiada za więcej niż moc" [level=2] [ref=f1e50]
            - paragraph [ref=f1e51]: Poza mocą sterownik decyduje o pracy filtra cząstek stałych, dawkowaniu AdBlue, ciśnieniu oleju, temperaturze silnika i limitach prędkości. Część tych nastaw da się dostroić do tego, jak naprawdę używasz pojazdu. Część prac rozwiązuje znane problemy fabryczne konkretnych rodzin silników, część może być konieczna z uwagi na zużycie niektórych podzespołów i starzenie się pojazdu.
            - paragraph [ref=f1e52]: Każdą modyfikację poprzedza odczyt błędów i parametrów bieżących. Jeśli problem leży w mechanice, powiemy Ci to przed wyceną zamiast sprzedawać usługę, która nie pomoże.
          - figure [ref=f1e54]:
            - img "Czerwony obrotomierz z rozświetloną podziałką do 8000 obrotów" [ref=f1e55]
