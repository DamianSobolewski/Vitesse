      - generic [ref=f1e85]:
        - generic [ref=f1e86]:
          - paragraph [ref=f1e87]: Układy oczyszczania spalin
          - heading "DPF / FAP, EGR, SCR i AdBlue" [level=2] [ref=f1e88]
          - paragraph [ref=f1e89]: Filtr cząstek stałych, zawór recyrkulacji spalin i układ AdBlue projektowano pod auto, które regularnie wyjeżdża w trasę i nagrzewa wydech. Przy krótkich odcinkach, w ruchu miejskim i we flocie kurierskiej regeneracja filtra nie dochodzi do końca, EGR zarasta nagarem, a błąd SCR potrafi odliczać kilometry do blokady rozruchu.
          - paragraph [ref=f1e90]: "Zaczynamy od diagnostyki: odczytu błędów, stopnia zapełnienia filtra i historii regeneracji. Potem ustawiamy progi i przebieg regeneracji pod Twój sposób jazdy, korygujemy pracę EGR i dawkowanie AdBlue. Jeśli filtr jest mechanicznie zużyty, usłyszysz to od nas przed wyceną."
          - heading "Kiedy warto" [level=3] [ref=f1e91]
          - list [ref=f1e92]:
            - listitem [ref=f1e93]: Auto z silnikiem diesla eksploatowane jest głównie na krótkich dystansach
            - listitem [ref=f1e94]: Awarie układów oczyszczania spalin nasilają się, a koszty napraw rosną
            - listitem [ref=f1e95]: Gdy serwis, mimo wymiany wielu części, nie potrafi zlokalizować usterki
        - figure [ref=f1e97]:
          - img "Przekrój filtra spalin i układu SCR na tle metalowej siatki" [ref=f1e98]
      - generic [ref=f1e100]:
        - generic [ref=f1e101]:
          - paragraph [ref=f1e102]: Komfort i trwałość
          - heading "Wyłączanie systemu Start&Stop" [level=2] [ref=f1e103]
          - paragraph [ref=f1e104]: System start-stop gasi silnik na każdych światłach i uruchamia go, gdy puszczasz hamulec. W mieście to kilkadziesiąt rozruchów dziennie, a każdy obciąża rozrusznik, akumulator i koło dwumasowe. Przycisk na konsoli wyłącza system tylko do następnego uruchomienia auta, więc naciskasz go przy każdym starcie.
          - paragraph [ref=f1e105]: "Wyłączamy start-stop programowo, w sterowniku silnika. Auto zapamiętuje ten stan na stałe: nie dotykasz niczego po odpaleniu, a pozostałe funkcje działają jak dotąd. Możemy także odwrócić działanie przycisku."
          - heading "Kiedy warto" [level=3] [ref=f1e106]
          - list [ref=f1e107]:
            - listitem [ref=f1e108]: Jeździsz głównie po mieście i silnik gaśnie kilkadziesiąt razy dziennie.
            - listitem [ref=f1e109]: Wymieniałeś akumulator albo rozrusznik wcześniej, niż zakłada serwis.
            - listitem [ref=f1e110]: Masz dość wyłączania systemu przyciskiem po każdym uruchomieniu.
            - listitem [ref=f1e111]: Lubisz jeździć dynamicznie a system wyłącza silnik zaraz po ostrym przyspieszaniu
        - figure [ref=f1e113]:
          - img "Palec naciskający przycisk Start&Stop wśród przycisków na konsoli środkowej" [ref=f1e114]
      - generic [ref=f1e116]:
        - generic [ref=f1e117]:
          - paragraph [ref=f1e118]: Ochrona silnika
          - heading "Podnoszenie ciśnienia oleju" [level=2] [ref=f1e119]
          - paragraph [ref=f1e120]: W wielu nowoczesnych silnikach pompa oleju ma regulowaną wydajność, a sterownik ustawia ją możliwie nisko, żeby oszczędzać paliwo. Na papierze to wystarcza. W praktyce, przy gorącym silniku, zużytym oleju i dużym obciążeniu, ciśnienie spada do granicy, za którą zaczyna się przyspieszone zużycie panewek wałka i łańcucha rozrządu.
          - paragraph [ref=f1e121]: Korygujemy mapę sterowania pompą tak, by ciśnienie w całym zakresie obrotów trzymało bezpieczny zapas. Koszt tej modyfikacji jest symboliczny w porównaniu do kosztu związanego z remontem lub wymianą silnika.
          - heading "Kiedy warto" [level=3] [ref=f1e122]
          - list [ref=f1e123]:
            - listitem [ref=f1e124]: Silnik z rodziny znanej z problemów z łańcuchem rozrządu albo panewkami.
            - listitem [ref=f1e125]: "Auto pracuje pod obciążeniem: przyczepa, kamper, dostawczak z ładunkiem."
            - listitem [ref=f1e126]: Po chip tuningu, gdy wyższy moment wymaga lepszego smarowania.
            - listitem [ref=f1e127]: Jeśli lubisz autem poszaleć lub używasz go czasem na torze.
        - figure [ref=f1e129]:
          - img "Wskaźnik ciśnienia oleju z podziałką od 0 do 8 i czerwoną kontrolką obok" [ref=f1e130]
      - generic [ref=f1e132]:
        - generic [ref=f1e133]:
          - paragraph [ref=f1e134]: Ochrona silnika
          - heading "Obniżanie temperatury pracy silnika" [level=2] [ref=f1e135]
          - paragraph [ref=f1e136]: "Producenci podnoszą temperaturę pracy silnika, bo gorętszy silnik to niższe spalanie w teście homologacyjnym. Dla silnika pracującego pod obciążeniem to kłopot: mniejszy zapas do przegrzania, gęstszy nagar, szybciej starzejący się olej i uszczelki."
          - paragraph [ref=f1e137]: Zmieniamy progi termostatu sterowanego elektronicznie i charakterystykę pracy wentylatorów, żeby silnik utrzymywał niższą, stabilną temperaturę. Przedłuży to żywotność wielu elementów, zapewni też większe rezerwy bezpieczeństwa.
          - heading "Kiedy warto" [level=3] [ref=f1e138]
          - list [ref=f1e139]:
            - listitem [ref=f1e140]: Jeździsz z przyczepą, kamperem albo z pełnym ładunkiem w upały.
            - listitem [ref=f1e141]: Wskaźnik temperatury wchodzi wysoko na podjazdach i w korkach.
            - listitem [ref=f1e142]: Silnik po modyfikacjach mocy, które podnoszą ilość ciepła do odebrania.
        - figure [ref=f1e144]:
          - img "Wskaźnik temperatury pracy silnika na desce rozdzielczej, wskazówka w środkowej części skali" [ref=f1e145]
      - generic [ref=f1e147]:
        - generic [ref=f1e148]:
          - paragraph [ref=f1e149]: Kolektor dolotowy
          - heading "Klapy wirowe" [level=2] [ref=f1e150]
          - paragraph [ref=f1e151]: "Klapy w kolektorze dolotowym mają zawirowywać powietrze przy niskich obrotach. W kilku popularnych rodzinach silników to typowy punkt awaryjny: zacierają się od nagaru, pękają osie i dźwignie, a urwany element potrafi trafić do cylindra. Sterownik widzi niezgodność położenia i zapala kontrolkę, czasem z trybem awaryjnym."
          - paragraph [ref=f1e152]: Jeśli naprawa mechaniczna nie ma sensu, można klapy zablokować lub zdemontować (ewentualnie wymienić kolektor na wersję bez klap) oraz wyłączyć je programowo. Bez błędów i bez ryzyka, że luźna część wpadnie do dolotu.
          - heading "Kiedy warto" [level=3] [ref=f1e153]
          - list [ref=f1e154]:
            - listitem [ref=f1e155]: Błąd położenia klap wraca po skasowaniu albo po wymianie siłownika.
            - listitem [ref=f1e156]: Kolektor był już naprawiany, a usterka pojawia się ponownie.
            - listitem [ref=f1e157]: Chcesz uniknąć kosztownej wymiany całego kolektora.
        - figure [ref=f1e159]:
          - 'img "Schemat poglądowy: kanał kolektora dolotowego z klapą wirową fabryczną i po zablokowaniu" [ref=f1e160]':
            - generic [ref=f1e161]:
              - generic [ref=f1e162]: FABRYCZNIE
              - generic [ref=f1e178]: do cylindra
              - generic [ref=f1e180]: ruchoma klapa i dźwignia
            - generic [ref=f1e181]:
              - generic [ref=f1e182]: PO ZABLOKOWANIU
              - generic [ref=f1e201]: do cylindra
              - generic [ref=f1e203]: zablokowana · bez ryzyka
            - generic [ref=f1e204]: schemat poglądowy · przekrój kolektora z klapą wirową
      - generic [ref=f1e206]:
        - generic [ref=f1e207]:
          - paragraph [ref=f1e208]: Floty i tor
          - heading "Limitery prędkości i obrotów" [level=2] [ref=f1e209]
          - paragraph [ref=f1e210]: Jeśli limiter prędkości przeszkadza Ci na autostradzie – możemy go przesunąć lub zdjąć.
          - paragraph [ref=f1e211]: Ale limitery to także świetne narzędzie w kontroli kosztów we flotach pojazdów. Ich założenie pozwala obniżyć zarówno zużycie paliwa jak i całego układu napędowego, co przekłada się na niższe koszty utrzymania floty.
          - paragraph [ref=f1e212]: "Zakładamy, przesuwamy albo zdejmujemy ograniczenia prędkości i obrotów w sterowniku. Wartość ustalasz Ty: jedną dla całej floty albo inną dla każdego pojazdu. Zmianę dokumentujemy, więc przy kontroli ubezpieczyciela masz czarno na białym, co i kiedy ustawiono."
        - generic [ref=f1e213]:
          - heading "Co robimy" [level=3] [ref=f1e214]
          - list [ref=f1e215]:
            - listitem [ref=f1e216]:
              - generic [ref=f1e222]:
                - heading "Limit prędkości pod politykę floty" [level=4] [ref=f1e223]
                - text: Jedna wartość dla wszystkich aut, na przykład 120 km/h, albo osobna dla dostawczych i osobowych.
            - listitem [ref=f1e224]:
              - generic [ref=f1e228]:
                - heading "Limit obrotów dla trwałości silnika" [level=4] [ref=f1e229]
                - text: Ustawienie limitera np. na 3000 obr/min pozwala sprawnie się poruszać, ograniczając jednocześnie spalanie i przedwczesne zużycie silnika.
            - listitem [ref=f1e230]:
              - generic [ref=f1e235]:
                - heading "Obsługa partiami, faktury" [level=4] [ref=f1e236]
                - generic [ref=f1e237]:
                  - text: Flotę programujemy w umówionych turach, żeby auta nie stały w jednym tygodniu.
                  - link "Zobacz ofertę dla flot" [ref=f1e238] [cursor=pointer]:
                    - /url: /podnoszenie-mocy/oferta-dla-flot/
                  - text: .
      - generic [ref=f1e240]:
        - generic [ref=f1e241]:
          - paragraph [ref=f1e242]: Układ wydechowy
          - heading "Druga sonda lambda" [level=2] [ref=f1e243]
          - paragraph [ref=f1e244]: Druga sonda, za katalizatorem, nie steruje składem mieszanki. Sprawdza tylko, czy katalizator pracuje. Po jego wymianie na inny niż fabryczny albo przy zużytym wkładzie sterownik widzi odchyłkę i zapala check engine, czasem także z trybem awaryjnym.
          - paragraph [ref=f1e245]: Programowo wyłączamy diagnostykę drugiej sondy w sterowniku. Silnik dalej pracuje na pierwszej sondzie, więc skład mieszanki i spalanie zostają bez zmian. Znikają kontrolka i błędy P0420 oraz P0430. Jeśli katalizator jest sprawny, a błąd bierze się z nieszczelności wydechu, najpierw powiemy Ci o tym.
          - heading "Kiedy warto" [level=3] [ref=f1e246]
          - list [ref=f1e247]:
            - listitem [ref=f1e248]: Po wymianie katalizatora na zamiennik, który sterownik uznaje za niesprawny.
            - listitem [ref=f1e249]: Błąd P0420 lub P0430 wraca po każdym skasowaniu.
            - listitem [ref=f1e250]: Jazda z kontrolką „check engine” to ryzyko przeoczenia innych usterek
        - figure [ref=f1e252]:
          - img "Żółta kontrolka check engine na zegarze samochodu" [ref=f1e253]
      - generic [ref=f1e255]:
        - generic [ref=f1e256]:
          - paragraph [ref=f1e257]: Zimny rozruch
          - heading "Korekta dawki rozruchowej" [level=2] [ref=f1e258]
          - paragraph [ref=f1e259]: Jeśli na zimnym silniku nie ma problemów z rozruchem, ale pojawiają się na rozgrzanym, wtedy najczęściej przyczyną są częściowo zużyte (pompo)wtryskiwacze. Gorące paliwo jest rzadsze i ucieka do powrotów przez drobne nieszczelności, przez co fabryczna dawka paliwa okazuje się zbyt mała do skutecznego rozruchu. Programowa korekta dawki rozruchowej pozwala na uniknięcie większych kosztów związanych z regeneracją lub wymianą wtryskiwaczy.
        - figure [ref=f1e261]:
          - img "Dłoń przekręcająca kluczyk w stacyjce, w tle zegar prędkościomierza" [ref=f1e262]
      - generic [ref=f1e264]:
        - generic [ref=f1e265]:
          - paragraph [ref=f1e266]: Subaru
          - heading "Pompa powietrza dodatkowego SAI" [level=2] [ref=f1e267]
          - paragraph [ref=f1e268]: Układ SAI wdmuchuje powietrze do wydechu przez pierwsze dwie minuty po zimnym rozruchu, żeby szybciej nagrzać katalizator. W Subaru pompa i zawory zapiekają się od wilgoci, a sterownik zgłasza błędy z zakresu P0410 do P2444 i zapala check engine. Naprawa to komplet części za kilka tysięcy złotych, a usterka lubi wracać.
          - paragraph [ref=f1e269]: "Programowo wyłączamy układ SAI w sterowniku: ECU przestaje oczekiwać pompy i zaworów, kontrolka gaśnie, tryb awaryjny się nie włącza. Praca rozgrzanego silnika nie zmienia się, bo układ i tak działa tylko chwilę po starcie. Pompę i zawory zostawiasz albo demontujesz."
          - heading "Kiedy warto" [level=3] [ref=f1e270]
          - list [ref=f1e271]:
            - listitem [ref=f1e272]: Subaru z błędami P0410, P0411 albo P2440 do P2444.
            - listitem [ref=f1e273]: Pompa SAI była już wymieniana i usterka wróciła.
            - listitem [ref=f1e274]: Check engine zapala się tylko po zimnym rozruchu.
        - figure [ref=f1e276]:
          - img "Kontrolka check engine na czerwonym obrotomierzu" [ref=f1e277]
      - generic [ref=f1e279]:
        - generic [ref=f1e280]:
          - paragraph [ref=f1e281]: Mechanika i oprogramowanie
          - heading "Czyszczenie układów dolotowych" [level=2] [ref=f1e282]
          - paragraph [ref=f1e283]: W silnikach z wtryskiem bezpośrednim paliwo nie obmywa zaworów dolotowych, więc nagar z odmy i EGR osiada na nich warstwa po warstwie. Ten problem może pojawić się już nawet po kilkudziesięciu tysiącach kilometrów. Żaden dodatek do paliwa tego nie usunie.
          - paragraph [ref=f1e284]: "Zaczynamy od kamerki inspekcyjnej, czyścimy kolektor i zawory chemicznie i mechanicznie – łupinkami orzechów pod ciśnieniem. Efekt możemy sprawdzić na hamowni: pomiar przed i po pokazuje, ile mocy wróciło."
          - heading "Kiedy warto" [level=3] [ref=f1e285]
          - list [ref=f1e286]:
            - listitem [ref=f1e287]: Gdy silnik dymi lub szybko wracają problemy z DPFem
            - listitem [ref=f1e288]: Nierówna praca na biegu jałowym, szarpanie i gorsze przyspieszenie.
            - listitem [ref=f1e289]: Przed chip tuningiem, żeby program pracował na czystym dolocie.
