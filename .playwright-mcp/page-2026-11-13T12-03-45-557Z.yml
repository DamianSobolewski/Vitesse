      - generic [ref=e362]:
        - generic [ref=e363]:
          - paragraph [ref=e364]: Sterownik skrzyni
          - heading "Programowanie skrzyń biegów (TCU)" [level=2] [ref=e365]
          - paragraph [ref=e366]: Skrzynia automatyczna ma własny komputer. To on decyduje, kiedy zmienić bieg, jak szybko to zrobić i ile momentu przepuścić przez sprzęgła. Po chip tuningu większy moment obrotowy silnika może nie zostać zrealizowany, jeśli limitery zapisane w skrzyni biegów na to nie pozwolą.
          - paragraph [ref=e367]: "Programujemy TCU pod nowe parametry silnika: szybsza zmiana przełożeń, wyższy limit momentu na sprzęgłach, wcześniejsza blokada konwertera, dopasowane punkty zmiany biegów. Przy większych przyrostach momentu to nie dodatek, tylko warunek, żeby zestaw pracował bezpiecznie."
          - heading "Kiedy warto" [level=3] [ref=e368]
          - list [ref=e369]:
            - listitem [ref=e370]: Po chip tuningu auta z automatem, zwłaszcza DSG, ZF 8HP i skrzyniach dwusprzęgłowych.
            - listitem [ref=e371]: Gdy powolny start powoduje dodatkowe emocje przy włączaniu się do ruchu
            - listitem [ref=e372]: Gdy skrzynia zmienia biegi przy zbyt niskich obrotach silnika
        - figure [ref=e374]:
          - img "Lewarek automatycznej skrzyni biegów w konsoli środkowej" [ref=e375]
      - generic [ref=e377]:
