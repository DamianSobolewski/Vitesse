          - heading "O nas" [level=1] [ref=f1e44]
          - paragraph [ref=f1e45]: Firma została założona w 2008 roku i od samego początku pracuje z autoryzacją renomowanej firmy V-tech.
      - generic [ref=f1e47]:
        - generic [ref=f1e48]:
          - paragraph [ref=f1e49]: Kim jesteśmy
          - heading "Tuningujemy auta od 2008 roku" [level=2] [ref=f1e50]
          - paragraph [ref=f1e51]: VITESSE działa w Łodzi przy ulicy Kolumny 267C. Autoryzację V-tech otrzymaliśmy w kwietniu 2008 roku i od tego czasu zajmujemy się modyfikacjami oprogramowania sterowników oraz pomiarami na hamowni. Robimy chip tuning, PowerChipy, odblokowywanie sterowników, eco-tuning dla flot, modyfikacje aut elektrycznych i hybryd oraz pomiary na hamowni 4×4 i motocyklowej. Przez lata prowadziliśmy też serwis mechaniczny Scanii i Volvo. Chip tuning ciężarówek i autobusów zostaje w ofercie. Wcześniej pracowaliśmy w Tuszynie przy Tysiąclecia 17B, ten adres jest już nieaktualny.
        - figure [ref=f1e53]:
          - img "Budynek warsztatu Vitesse z bramami garażowymi i placem przed wejściem" [ref=f1e54]
      - generic [ref=f1e56]:
        - generic [ref=f1e57]:
          - paragraph [ref=f1e58]: Nasza filozofia
          - heading "Certyfikat, gwarancja, okres testowy" [level=2] [ref=f1e59]
          - paragraph [ref=f1e60]: Na każdą modyfikację mocy wystawiany jest papierowy certyfikat, potwierdzający że program został profesjonalnie przygotowany.
          - paragraph [ref=f1e61]: Na nasze usługi udzielamy dwuletniej gwarancji. Gdyby w tym czasie pojawiły się jakieś błędy, dymienie, szarpanie itp. – bezpłatnie skorygujemy program.
          - paragraph [ref=f1e62]: Nie ponosisz żadnego ryzyka – dajemy Ci tydzień na przetestowanie naszych modyfikacji (w przypadku samochodów ciężarowych i autobusów – dwa tygodnie). Jeśli nie będziesz zadowolony z efektów – przywracamy ustawienia fabryczne i zwracamy pieniądze.
        - figure [ref=f1e64]:
          - img "Certyfikat V-tech wystawiany na każdą modyfikację mocy, z długopisem na biurku" [ref=f1e65]
