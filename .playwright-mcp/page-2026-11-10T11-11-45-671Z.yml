      - generic [ref=e318]:
        - generic [ref=e319]:
          - paragraph [ref=e320]: Sterownik skrzyni
          - heading "Programowanie skrzyń biegów (TCU)" [level=2] [ref=e321]
          - paragraph [ref=e322]: Skrzynia automatyczna ma własny komputer. To on decyduje, kiedy zmienić bieg, jak szybko to zrobić i ile momentu przepuścić przez sprzęgła. Po chip tuningu większy moment obrotowy silnika może nie zostać zrealizowany, jeśli limitery zapisane w skrzyni biegów na to nie pozwolą.
          - paragraph [ref=e323]: "Programujemy TCU pod nowe parametry silnika: szybsza zmiana przełożeń, wyższy limit momentu na sprzęgłach, wcześniejsza blokada konwertera, dopasowane punkty zmiany biegów. Przy większych przyrostach momentu to nie dodatek, tylko warunek, żeby zestaw pracował bezpiecznie."
          - heading "Kiedy warto" [level=3] [ref=e324]
          - list [ref=e325]:
