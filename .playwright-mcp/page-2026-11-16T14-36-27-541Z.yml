            - paragraph [ref=e340]: Sprawdzamy wersję silnika, odczytujemy błędy i oceniamy stan techniczny. Jeśli auto wymaga naprawy, poinformujemy Cię o jej kosztach.
          - generic [ref=e341]:
            - generic [ref=e342]: Krok 2
            - heading "Pomiar na hamowni" [level=3] [ref=e343]
            - paragraph [ref=e344]: Auto wjeżdża na rolki. Mierzymy moc i moment, by ocenić stan techniczny silnika i mieć punkt wyjścia dla dalszych modyfikacji.
          - generic [ref=e345]:
            - generic [ref=e346]: Krok 3
            - heading "Indywidualne strojenie" [level=3] [ref=e347]
            - paragraph [ref=e348]: Chip tuning, PowerChip albo eco-tuning pod Twój egzemplarz. Odczyt oryginalnego oprogramowania zostaje na serwerze, by w razie potrzeby zawsze można było do niego wrócić.
