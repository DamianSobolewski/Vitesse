        - generic [ref=f1e43]:
          - paragraph [ref=f1e44]: Chip tuning Łódź
          - heading "Chip tuning / PowerChipy" [level=1] [ref=f1e45]
          - paragraph [ref=f1e46]: Więcej mocy i momentu z rezerw, które producent zostawił w silniku. Program lub moduł PowerChip indywidualnie strojony do danego egzemplarza. Potwierdzenie efektów na hamowni, tydzień na przetestowanie na co dzień.
      - generic [ref=f1e48]:
        - generic [ref=f1e49]:
          - paragraph [ref=f1e50]: Wyszukiwarka mocy
          - heading "Sprawdź, ile zyska Twój silnik" [level=2] [ref=f1e51]
          - generic [ref=f1e52]:
            - paragraph [ref=f1e53]: Wybierz markę, model i wersję silnika. Zobaczysz, jakich efektów możesz oczekiwać po wizycie u nas, zarówno po chip tuningu, jak i po montażu PowerChipa.
            - paragraph [ref=f1e54]: Chip tuning to zmiana parametrów w oprogramowaniu sterownika silnika, m.in. dawki i ciśnienia paliwa, ciśnienia doładowania i kąta wtrysku, przy kontroli temperatur w dolocie i wydechu.
            - paragraph [ref=f1e55]: PowerChip to zewnętrzne urządzenie wpinane wtyczkami do wiązki silnika. Montujemy go tam, gdzie nie ma możliwości modyfikacji programu, oraz w autach na gwarancji. Jest możliwość sterowania modułem z poziomu aplikacji w telefonie.
          - paragraph [ref=f1e56]: Nie ma Twojej wersji w katalogu? Zadzwoń. Katalog nie obejmuje wszystkiego, nad czym pracujemy.
