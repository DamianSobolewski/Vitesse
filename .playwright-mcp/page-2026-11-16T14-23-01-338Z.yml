          - paragraph [ref=e43]: Kim jesteśmy
          - heading "O nas" [level=1] [ref=e44]
          - paragraph [ref=e45]: Firma została założona w 2008 roku i od samego początku pracuje z autoryzacją renomowanej firmy V-tech.
      - generic [ref=e47]:
        - generic [ref=e48]:
          - paragraph [ref=e49]: Kim jesteśmy
          - heading "Tuningujemy auta od 2008 roku" [level=2] [ref=e50]
          - paragraph [ref=e51]: VITESSE działa w Łodzi przy ulicy Kolumny 267C. Autoryzację V-tech otrzymaliśmy w kwietniu 2008 roku i od tego czasu zajmujemy się modyfikacjami oprogramowania sterowników oraz pomiarami na hamowni. Robimy chip tuning, PowerChipy, odblokowywanie sterowników, eco-tuning dla flot, modyfikacje aut elektrycznych i hybryd oraz pomiary na hamowni 4×4 i motocyklowej. Przez lata prowadziliśmy też serwis mechaniczny Scanii i Volvo. Chip tuning ciężarówek i autobusów zostaje w ofercie. Wcześniej pracowaliśmy w Tuszynie przy Tysiąclecia 17B, ten adres jest już nieaktualny.
        - figure [ref=e53]:
          - img "Żółte Porsche z otwartymi drzwiami na hamowni podwoziowej w warsztacie Vitesse" [ref=e54]
      - generic [ref=e56]:
        - generic [ref=e57]:
          - paragraph [ref=e58]: Nasza filozofia
          - heading "Certyfikat, gwarancja, okres testowy" [level=2] [ref=e59]
          - paragraph [ref=e60]: Na każdą modyfikację mocy wystawiany jest papierowy certyfikat, potwierdzający że program został profesjonalnie przygotowany.
          - paragraph [ref=e61]: Na nasze usługi udzielamy dwuletniej gwarancji. Gdyby w tym czasie pojawiły się jakieś błędy, dymienie, szarpanie itp. – bezpłatnie skorygujemy program.
          - paragraph [ref=e62]: Nie ponosisz żadnego ryzyka – dajemy Ci tydzień na przetestowanie naszych modyfikacji (w przypadku samochodów ciężarowych i autobusów – dwa tygodnie). Jeśli nie będziesz zadowolony z efektów – przywracamy ustawienia fabryczne i zwracamy pieniądze.
        - figure [ref=e64]:
          - img "Certyfikat V-tech wystawiany na każdą modyfikację mocy, z długopisem na biurku" [ref=e65]
